name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x install.sh skills/*/scripts/*.sh
      - name: validate config.json
        run: python3 -m json.tool config.json > /dev/null
